name: Mirror to GitLab

# Keeps https://gitlab.com/Samukelo-Mkhonza/abafana-belokishi-website
# in sync with this repo. GitHub is the source of truth; GitLab is a
# read-only mirror. Runs on every push to main and whenever tags change.
on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

jobs:
  mirror:
    name: Push mirror
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/Samukelo-Mkhonza/abafana-belokishi-website.git"
          git push gitlab --all
          git push gitlab --tags
