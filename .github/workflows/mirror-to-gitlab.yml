name: Mirror to GitLab

# Keeps https://gitlab.com/Samukelo-Mkhonza/abafana-belokishi-website
# in sync with this repo. GitHub is the source of truth; GitLab is a
# read-only mirror. Runs on every push to main and whenever tags change.
on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Push mirror
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        # The token goes in as a one-off auth header instead of the remote URL,
        # so it never lands in .git/config or in git's error output.
        run: |
          auth=$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git remote add gitlab https://gitlab.com/Samukelo-Mkhonza/abafana-belokishi-website.git
          git -c http.https://gitlab.com/.extraheader="Authorization: Basic $auth" push gitlab --all
          git -c http.https://gitlab.com/.extraheader="Authorization: Basic $auth" push gitlab --tags
